<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Avatar placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3eafb"/>
      <stop offset="45%" stop-color="#ddc4f2"/>
      <stop offset="100%" stop-color="#b892d9"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b45b0"/>
      <stop offset="100%" stop-color="#5c3479"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" rx="48" fill="url(#bg)"/>
  <rect width="400" height="400" rx="48" fill="url(#glow)"/>

  <!-- 装饰星点 -->
  <g fill="#ffffff" opacity="0.65">
    <polygon points="72,64 74.4,72 82,72 76,76.4 78.4,84 72,79.6 65.6,84 68,76.4 62,72 69.6,72"/>
    <polygon points="330,96 331.6,101 336,101 332.4,104 333.6,109 330,106.2 326.4,109 327.6,104 324,101 328.4,101"/>
    <circle cx="316" cy="300" r="3.5"/>
    <circle cx="96" cy="306" r="2.5"/>
  </g>

  <!-- 主字母 -->
  <text x="200" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="186" font-weight="700" fill="url(#letter)" opacity="0.92">W</text>

  <!-- 底部小字 -->
  <line x1="152" y1="300" x2="248" y2="300" stroke="#8b45b0" stroke-width="2" opacity="0.5"/>
  <text x="200" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="20" letter-spacing="5" fill="#6b4f8a" opacity="0.85">BUPT</text>
</svg>
